# Runs the whole system from the images CircleCI publishes to ghcr.io.
#
#   docker compose pull && docker compose up -d     # use the published images
#   docker compose up -d --build                    # or build them locally
#
# IMAGE_PREFIX and TAG pick which images to run (defaults: Dias266's latest).

x-image-prefix: &prefix ${IMAGE_PREFIX:-ghcr.io/dias266/spe}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  iot-control-unit:
    image: ${IMAGE_PREFIX:-ghcr.io/dias266/spe}-iot-control-unit:${TAG:-latest}
    build: ./Embedded-Systems-gs-main
    environment:
      BROKER_URL: mqtt://mosquitto:1883
    ports:
      - "3002:3002"
    depends_on:
      - mosquitto
    

  embedded-dashboard-system-service:
    image: python:3.9-alpine
    working_dir: /app/Embedded-Systems-gs-main
    volumes:
      - .:/app
    environment:
      - MQTT_HOST=host.docker.internal
      - BROKER_URL=mqtt://host.docker.internal:1883
      - MQTT_URL=mqtt://host.docker.internal:1883
    command: >
      sh -c "apk add --no-cache nodejs npm && npm install && python3 -m http.server 8081"
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      


  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet        # demo only, like the anonymous MQTT broker
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      retries: 15

  mas:
    image: ${IMAGE_PREFIX:-ghcr.io/dias266/spe}-mas:${TAG:-latest}
    build: ./Multi-Agent-System
    environment:
      IOT_BACKEND_URL: http://iot-control-unit:3002
      DATABASE_URL: jdbc:postgresql://postgres:5432/fleet
      DATABASE_USER: fleet
      DATABASE_PASSWORD: fleet
    depends_on:
      iot-control-unit:
        condition: service_started
      postgres:
        condition: service_healthy

  ml-service:
    image: ${IMAGE_PREFIX:-ghcr.io/dias266/spe}-ml-service:${TAG:-latest}
    build: ./ML-model
    environment:
      INSTANCES: "1 2 3 4 5 6 7 8 9"
      DASHBOARD_LOG: /shared/final_predictions_log.txt
      DATABASE_URL: postgresql://fleet:fleet@postgres:5432/fleet
    volumes:
      - predictions:/shared
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  dashboard-backend:
    image: ${IMAGE_PREFIX:-ghcr.io/dias266/spe}-dashboard-backend:${TAG:-latest}
    build: ./MAS_system_node_server_on-main/back/backend
    environment:
      AGENT_BASE_URL: http://mas:3272
      PREDICTIONS_LOG: /shared/final_predictions_log.txt
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet
    volumes:
      - predictions:/shared
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/dias266/spe}-dashboard-frontend:${TAG:-latest}
    build: ./MAS_system_node_server_on-main/back/frontend
    ports:
      - "8080:80"
    depends_on:
      - dashboard-backend

  node-red:
    image: nodered/node-red:4.0
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data

volumes:
  predictions:
  nodered_data:
  pgdata: